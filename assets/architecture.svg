<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
    <style>
      .box{rx:12;ry:12;stroke-width:2;}
      .t{fill:#0f172a;font-size:15px;font-weight:600;}
      .s{fill:#475569;font-size:11px;}
      .lbl{fill:#2563eb;font-size:11px;font-weight:600;}
    </style>
  </defs>

  <text x="460" y="26" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">OpenRemoteGUI — request path</text>

  <!-- boxes -->
  <g>
    <rect x="20"  y="70" width="130" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="85" y="100" text-anchor="middle" class="t">Browser</text>
    <text x="85" y="120" text-anchor="middle" class="s">Chrome / Edge</text>

    <rect x="190" y="70" width="130" height="70" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="255" y="100" text-anchor="middle" class="t">noVNC</text>
    <text x="255" y="120" text-anchor="middle" class="s">web client</text>

    <rect x="360" y="70" width="140" height="70" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="430" y="100" text-anchor="middle" class="t">websockify</text>
    <text x="430" y="120" text-anchor="middle" class="s">WS &#8596; VNC bridge</text>

    <rect x="540" y="70" width="150" height="70" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="615" y="98" text-anchor="middle" class="t">wayvnc</text>
    <text x="615" y="118" text-anchor="middle" class="s">127.0.0.1:5900</text>

    <rect x="730" y="70" width="160" height="70" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="810" y="98" text-anchor="middle" class="t">Wayland</text>
    <text x="810" y="118" text-anchor="middle" class="s">desktop session</text>
  </g>

  <!-- arrows -->
  <g stroke="#3b82f6" stroke-width="2" fill="none">
    <line x1="150" y1="105" x2="188" y2="105" marker-end="url(#arw)"/>
    <line x1="320" y1="105" x2="358" y2="105" marker-end="url(#arw)"/>
    <line x1="500" y1="105" x2="538" y2="105" marker-end="url(#arw)"/>
    <line x1="690" y1="105" x2="728" y2="105" marker-end="url(#arw)"/>
  </g>

  <!-- edge labels -->
  <text x="169" y="62" text-anchor="middle" class="lbl">HTTP :6080</text>
  <text x="339" y="62" text-anchor="middle" class="lbl">WebSocket</text>
  <text x="519" y="62" text-anchor="middle" class="lbl">VNC</text>
  <text x="709" y="62" text-anchor="middle" class="lbl">capture</text>

  <!-- footer note -->
  <rect x="20" y="175" width="870" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="460" y="200" text-anchor="middle" fill="#334155" font-size="12.5">
    One browser-facing port (6080). Raw VNC stays on loopback (5900). No vendor cloud, no client install.
  </text>
</svg>
